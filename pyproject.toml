[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-phishing"
version = "0.1.0"
description = "Analizador local y explicable de señales de phishing en archivos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf==6.10.0"]
license = "MIT"

[project.scripts]
faro = "faro.__main__:main"

[tool.setuptools.packages.find]
include = ["faro*"]

[tool.setuptools.package-data]
faro = ["web/*", "samples/*"]
